seed_everything: 0
trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger:
    class_path: custom_loggers.wandb_explicit.WandbLoggerExplicit
    init_args:
      project: EuroCrops-4000OOD-900ID-SLR-Supervised
      name: EuroCrops-4000OOD-900ID-SSL4EO-MAE-ViTS16-SLR-r16-UNet-Train
      save_dir: ./outputs/eurocrops/PEFT/slr_supervised
      offline: false
      log_model: false
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  enable_checkpointing: true
  default_root_dir: ./outputs/eurocrops/PEFT/slr_supervised/4000OOD-900ID
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_average_F1-score
      mode: max
      save_top_k: 1
      save_last: true
      filename: epoch{epoch:02d}-val_f1{val_average_F1-score:.4f}
      auto_insert_metric_name: false
model:
  class_path: trainers.ssl4eo_mae_vit_unet_slr_task.SSL4EOMAEViTUNetSLRTask
  init_args:
    checkpoint_path: /home/hzm/.cache/torch/hub/checkpoints/ssl4eo/B13_vits16_mae_0099_ckpt.pth
    image_size: 256
    selected_blocks:
    - 1
    - 4
    - 7
    - 9
    - 11
    slr_rank: 16
    slr_blocks: null
    patch_embed_adapter: true
    norm_trainable: true
    train_cls_token: true
    slr_checkpoint_path: /home/hzm/hzm3/crop-type-transfer-learning-main/outputs/eurocrops/PEFT/slr_mae/EuroCrops-4000OOD-900ID-SLR-MAE/v0vvu4v2/checkpoints/epochepoch=65-stepstep=9108-val_lossval_loss=0.000325.ckpt
    strict_slr_loading: true
    in_channels: 13
    num_classes: 6
    loss: ce
    class_weights: null
    ignore_index: 0
    lr: 0.0001
    head_lr: 0.0005
    weight_decay: 0.05
    patience: 5
data:
  class_path: datamodules.sentinel2_global_train_explicit.Sentinel2GlobalTrainExplicit
  init_args:
    batch_size: 64
    patch_size: 256
    num_workers: 12
    sentinel2_paths: ./harmonized_global_crops/sentinel2_subsample_eurocrops_4000_900
    sentinel2_cache: false
    sentinel2_bands:
    - B01
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B09
    - B10
    - B11
    - B12
    cdl_paths: ./harmonized_global_crops/cdl_harmonized_block
    cdl_years:
    - 2023
    eurocrops_paths: ./harmonized_global_crops/eurocrops_cropped_subsampled
    nccm_paths: ./harmonized_global_crops/nccm_harmonized_block
    nccm_years:
    - 2019
    sact_paths: ./harmonized_global_crops/sact_harmonized/train/labels
    sas_paths: ./harmonized_global_crops/sas_harmonized
    sas_years:
    - 2021
