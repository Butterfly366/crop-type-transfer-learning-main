seed_everything: 0
trainer:
  max_steps: 10000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  logger:
    class_path: custom_loggers.wandb_explicit.WandbLoggerExplicit
    init_args:
      project: CDL-4000OOD-900ID-SLR-MAE
      name: CDL-4000OOD-900ID-SSL4EO-MAE-ViTS16-SLR-r16-Pretrain
      save_dir: ./outputs/cdl/PEFT/slr_mae
      offline: false
      log_model: false
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  enable_checkpointing: true
  default_root_dir: ./outputs/cdl/PEFT/slr_mae/4000OOD-900ID/ssl_pretrain
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      filename: epoch{epoch:02d}-step{step}-val_loss{val_loss:.6f}
model:
  class_path: trainers.ssl4eo_mae_vit_slr_task.SSL4EOMAEViTSLRTask
  init_args:
    checkpoint_path: /home/hzm/.cache/torch/hub/checkpoints/ssl4eo/B13_vits16_mae_0099_ckpt.pth
    image_size: 256
    in_channels: 13
    patch_size: 16
    mask_ratio: 0.75
    slr_rank: 16
    slr_blocks: null
    patch_embed_adapter: true
    norm_trainable: true
    train_cls_mask_tokens: true
    loss_on_all_patches: true
    norm_pix_loss: false
    decoder_embed_dim: 512
    decoder_depth: 8
    decoder_num_heads: 16
    lr: 0.0001
    weight_decay: 0.05
    min_lr: 0.0
    warmup_epochs: 5
data:
  class_path: datamodules.sentinel2_global_explicit.Sentinel2GlobalExplicit
  init_args:
    batch_size: 32
    patch_size: 256
    num_workers: 12
    sentinel2_paths: ./harmonized_global_crops/sentinel2_subsample_cdl_4000_900
    sentinel2_cache: false
    sentinel2_bands:
    - B01
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B09
    - B10
    - B11
    - B12
    cdl_paths: ./harmonized_global_crops/cdl_harmonized_block
    cdl_years:
    - 2023
    eurocrops_paths: ./harmonized_global_crops/eurocrops_cropped_subsampled
    nccm_paths: ./harmonized_global_crops/nccm_harmonized_block
    nccm_years:
    - 2019
    sact_paths: ./harmonized_global_crops/sact_harmonized/train/labels
    sas_paths: ./harmonized_global_crops/sas_harmonized
    sas_years:
    - 2021
